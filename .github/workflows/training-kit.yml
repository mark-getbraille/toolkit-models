# Publish the Picture Model Training Kit (training-kit/) as Picture-Model-Training-Kit.zip in the release
# "training-kit" whenever the kit changes on main, or by hand.
name: Publish the training kit

on:
  push:
    branches: ["main"]
    paths: ["training-kit/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # The accessibility test of every window (training-kit/tests/test_accessibility.py) and the Dataset Preparation
    # clean-up checks, on Windows, where the programs run. Nothing is published unless they pass.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wxPython, Pillow, NumPy, OpenCV, psutil and pytest
        run: python -m pip install wxPython==4.3.1 pillow==13.0.0 numpy==2.5.5 opencv-python-headless==4.14.0.94 psutil==7.2.2 pytest==9.1.1 pypdfium2==5.15.2 requests==2.32.5 pyarrow==21.0.0
      - name: Run the accessibility test
        run: python -m pytest -q training-kit/tests -p no:cacheprovider

  publish:
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Zip the kit
        run: |
          mkdir -p build/"Picture Model Training Kit"
          cp -r training-kit/. build/"Picture Model Training Kit"/
          (cd build && zip -qr Picture-Model-Training-Kit.zip "Picture Model Training Kit")
      - name: Upload it to the release
        run: |
          gh release view training-kit > /dev/null 2>&1 || gh release create training-kit --title "Picture Model Training Kit" \
            --notes "Unpack the zip and read READ ME FIRST.txt. Needs an NVIDIA graphics card with 12 GB or more of memory."
          gh release upload training-kit build/Picture-Model-Training-Kit.zip --clobber

  exe:
    # The one-click wizard, Picture Model Training.exe (training-kit/wizard/training_wizard.py, with the kit's files
    # inside), and Dataset Preparation.exe (training-kit/prepare/dataset_preparation.py), built on Windows and
    # published beside the zip.
    needs: test
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wxPython, cytolk, Pillow and PyInstaller
        # Pillow: "Check my pictures" opens each of your own pictures (kit/own_data.py, bundled into the program),
        # and "Describe pictures" makes big pictures smaller (kit/describe_package.py, also bundled). The research-terms
        # window lists the research-only collections from kit/sources.py (with more_sources, big_sources and
        # personal_sources, also bundled; personal_sources may be missing, which only gives a build warning).
        run: python -m pip install wxPython==4.3.1 cytolk==0.1.13 pillow==13.0.0 pypdfium2==5.15.2 pyinstaller==6.22.3 requests==2.32.5 pyarrow==21.0.0
      - name: Build the program
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "Picture Model Training" `
            --add-data "training-kit;training-kit" --collect-all cytolk `
            --paths training-kit/kit --paths training-kit/wizard --hidden-import own_data `
            --hidden-import describe_package --hidden-import describe_window --hidden-import PIL.Image `
            --hidden-import PIL.ImageOps --hidden-import sources --hidden-import more_sources `
            --hidden-import big_sources --hidden-import personal_sources --hidden-import extra_sources --hidden-import documentary_sources --hidden-import graphic_sources --hidden-import archive_sources `
            --hidden-import disability_sources --hidden-import review_sources --hidden-import adult_review_sources --hidden-import vintage_review_sources --hidden-import permission_sources `
            --hidden-import service_sources --hidden-import bodily_sources --hidden-import culture_sources --hidden-import land_industry_sources `
            --hidden-import home_sources --hidden-import events_safety_sources --hidden-import safety_rites_sources --hidden-import drug_firearm_sources --hidden-import princeton_personal_sources --hidden-import state_collections_personal_sources --hidden-import packaged_goods_sources `
            --hidden-import things_sources --hidden-import mechanical_sources --hidden-import people_activity_sources --hidden-import us_sources --hidden-import us_modern_sources --hidden-import device_sources --hidden-import work_farm_mech_sources --hidden-import state_sources --hidden-import med_vet_sources --hidden-import canada_sources --hidden-import university_sources --hidden-import bigtech_sources --hidden-import state_web_sources --hidden-import civil_defense_sources --hidden-import civil_defense_figures --hidden-import street_scene_sources --hidden-import hardware_sources --hidden-import home_safety_sources --hidden-import signup_sources --hidden-import uxo_personal_sources --hidden-import chemical_sources --hidden-import gaps_sources --hidden-import drinks_sources --hidden-import picture_reading_sources --hidden-import daily_access_sources --hidden-import outdoor_cooking_sources --hidden-import mental_health_sources --hidden-import fitness_nutrition_sources --hidden-import sexual_health_sources --hidden-import aging_care_sources --hidden-import wilderness_first_aid_sources --hidden-import money_work_sources --hidden-import gov_forms_sources --hidden-import travel_sources --hidden-import civics_sources --hidden-import vision_sources --hidden-import privacy_sources --hidden-import car_care_sources --hidden-import garden_sources --hidden-import home_health_sources --hidden-import instrument_care_sources --hidden-import home_crafts_sources --hidden-import electronics_sources --hidden-import building_sources --hidden-import crafts_sources --hidden-import preparedness_sources --hidden-import radio_sources --hidden-import power_sources --hidden-import practical_sources --hidden-import people_sources --hidden-import homestead_sources --hidden-import outdoors_sources --hidden-import games_sources --hidden-import science_use_sources --hidden-import clothing_sources --hidden-import plant_id_sources --hidden-import photo_library_sources --hidden-import small_boats_sources --hidden-import foraging_preserving_sources --hidden-import topics --hidden-import real_questions `
            training-kit/wizard/training_wizard.py
          $p = Start-Process -FilePath "dist\Picture Model Training.exe" -ArgumentList "--self-test" -Wait -PassThru `
            -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "The program's self-test failed" }
          Copy-Item "dist\Picture Model Training.exe" "Picture-Model-Training.exe"
      - name: Build Dataset Preparation
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "Dataset Preparation" `
            --add-data "training-kit;training-kit" --collect-all cytolk `
            --paths training-kit/kit --paths training-kit/wizard --paths training-kit/prepare `
            --hidden-import training_wizard --hidden-import describe_window --hidden-import describe_package `
            --hidden-import own_data --hidden-import PIL.Image --hidden-import PIL.ImageOps `
            --hidden-import review_pack --hidden-import needs_workspace `
            --hidden-import sources --hidden-import more_sources --hidden-import big_sources `
            --hidden-import personal_sources --hidden-import extra_sources --hidden-import documentary_sources `
            --hidden-import graphic_sources --hidden-import archive_sources --hidden-import disability_sources `
            --hidden-import review_sources --hidden-import adult_review_sources --hidden-import vintage_review_sources `
            --hidden-import permission_sources --hidden-import service_sources --hidden-import bodily_sources `
            --hidden-import culture_sources --hidden-import land_industry_sources --hidden-import home_sources `
            --hidden-import events_safety_sources --hidden-import safety_rites_sources --hidden-import drug_firearm_sources --hidden-import princeton_personal_sources --hidden-import state_collections_personal_sources --hidden-import packaged_goods_sources --hidden-import things_sources --hidden-import mechanical_sources --hidden-import people_activity_sources --hidden-import us_sources --hidden-import us_modern_sources --hidden-import device_sources --hidden-import work_farm_mech_sources --hidden-import state_sources --hidden-import med_vet_sources --hidden-import canada_sources --hidden-import university_sources --hidden-import bigtech_sources --hidden-import state_web_sources --hidden-import civil_defense_sources --hidden-import civil_defense_figures --hidden-import street_scene_sources --hidden-import hardware_sources --hidden-import home_safety_sources --hidden-import signup_sources --hidden-import uxo_personal_sources --hidden-import chemical_sources --hidden-import gaps_sources --hidden-import drinks_sources --hidden-import picture_reading_sources --hidden-import daily_access_sources --hidden-import outdoor_cooking_sources --hidden-import mental_health_sources --hidden-import fitness_nutrition_sources --hidden-import sexual_health_sources --hidden-import aging_care_sources --hidden-import wilderness_first_aid_sources --hidden-import money_work_sources --hidden-import gov_forms_sources --hidden-import travel_sources --hidden-import civics_sources --hidden-import vision_sources --hidden-import privacy_sources --hidden-import car_care_sources --hidden-import garden_sources --hidden-import home_health_sources --hidden-import instrument_care_sources --hidden-import home_crafts_sources --hidden-import electronics_sources --hidden-import building_sources --hidden-import crafts_sources --hidden-import preparedness_sources --hidden-import radio_sources --hidden-import power_sources --hidden-import practical_sources --hidden-import people_sources --hidden-import homestead_sources --hidden-import outdoors_sources --hidden-import games_sources --hidden-import science_use_sources --hidden-import clothing_sources --hidden-import plant_id_sources --hidden-import photo_library_sources --hidden-import small_boats_sources --hidden-import foraging_preserving_sources --hidden-import topics --hidden-import real_questions `
            training-kit/prepare/dataset_preparation.py
          $p = Start-Process -FilePath "dist\Dataset Preparation.exe" -ArgumentList "--self-test" -Wait -PassThru `
            -RedirectStandardOutput prepare-selftest.txt
          Get-Content prepare-selftest.txt
          if ($p.ExitCode -ne 0) { throw "Dataset Preparation's self-test failed" }
          Copy-Item "dist\Dataset Preparation.exe" "Dataset-Preparation.exe"
      - name: Upload it to the release
        shell: pwsh
        run: |
          gh release view training-kit *> $null
          if ($LASTEXITCODE -ne 0) { gh release create training-kit --title "Picture Model Training Kit" --notes "Run Picture-Model-Training.exe." }
          gh release upload training-kit Picture-Model-Training.exe Dataset-Preparation.exe --clobber
