            --notes "Picture packs for the Picture Model Training Kit (packs/build_packs.py); each zip has CREDITS.txt."
          key="${{ matrix.key }}"
          key="${key%+}"
          key="${key%\?}"
          if [ ! -f "build/packs/manifest-$key.json" ]; then
            echo "Nothing new to publish for $key: the published pack is kept as it was."
            exit 0
          fi
          files=$(python -c "import json;print(' '.join(json.load(open('build/packs/manifest-$key.json'))['files']))")
          # The pack's files first, its manifest last, so packs.json never names files that are not there yet.
          for f in $files manifest-$key.json; do
            for attempt in 1 2 3 4; do
              gh release upload training-data "build/packs/$f" --clobber && break
              sleep 30
            done
          done
      - name: Upload the pictures that need a description
        run: |
          # A separate release: training-data is never touched here. The zip has a new name for each version
          # (needs-<key>.v<N>.zip), so someone downloading the old one while this runs still gets a whole file.
          gh release view needs-description > /dev/null 2>&1 || gh release create needs-description \
            --title "Pictures that need a description" \
            --notes "Pictures the pack builders set aside because their description was missing or poor (packs/build_packs.py needs_description). Each needs-<key>.vN.zip opens in the training kit's Describe pictures (Import a package) or with Build a Review Pack.cmd. Nothing here is trained on until a person describes and checks it."
          key="${{ matrix.key }}"
          key="${key%+}"
          key="${key%\?}"
          if [ ! -f "build/packs/needs-manifest-$key.json" ]; then
            echo "No pictures were set aside for a description in $key."
            exit 0
          fi
          file=$(python -c "import json;print(json.load(open('build/packs/needs-manifest-$key.json'))['file'])")
          # The zip first, its manifest last, so needs-manifest.json never names a file that is not there yet.
          for f in $file needs-manifest-$key.json; do
            for attempt in 1 2 3 4; do
              gh release upload needs-description "build/packs/$f" --clobber && break
              sleep 30
            done
          done
