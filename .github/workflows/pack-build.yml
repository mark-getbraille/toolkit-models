# One lane of the training-pack builds, called by .github/workflows/packs.yml (which explains the packs, the key
# marks "+" and "?", the releases and the jobs that run after the builds). packs.yml calls this workflow twice: once
# for the packs that read Wikimedia Commons (build_packs.COMMONS_KEYS), two at a time, and once for every other pack,
# eight at a time. Commons refused requests (429) for hours when ten packs read it together, so the Commons packs
# failed or came out empty; in their own narrow lane they wait for each other instead.
# inputs.keys: the lane's pack keys as a JSON list (with their marks); inputs.parallel: how many build at once.
# The repository secrets (EUROPEANA_KEY, DPLA_API_KEY) come from packs.yml ("secrets: inherit").
name: Build training packs (one lane)

on:
  workflow_call:
    inputs:
      keys:
        description: "The pack keys to build, as a JSON list (\"loc_fsa+\" a top-up pass, \"loc_fsa?\" a needs-only run)"
        required: true
        type: string
      parallel:
        description: "How many packs of this lane build at the same time"
        required: true
        type: number

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.parallel }}
      matrix:
        key: ${{ fromJSON(inputs.keys) }}
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      # Europeana's free API key (a repository secret); without it the builders use the public demonstration key.
      EUROPEANA_KEY: ${{ secrets.EUROPEANA_KEY }}
      # The Digital Public Library of America's key (a repository secret); without it dpla_campus publishes nothing.
      DPLA_API_KEY: ${{ secrets.DPLA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the builder needs
        run: |
          python -m pip install requests pillow pyarrow "huggingface_hub>=0.34"
          key="${{ matrix.key }}"
          key="${key%+}"
          # The packs in other languages are also translated into English (OPUS-MT, on the processor); a needs-only
          # run ("key?") translates nothing.
          if [ "${key%\?}" != "$key" ]; then key="needs-only"; fi
          case "$key" in
            ksamsok|rijksmuseum|coco_cn|europeana_fi|europeana_cs|europeana_hu|europeana_el|europeana_no|europeana_pl|smk|anefo)
              python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
              python -m pip install "transformers==4.57.6" "sentencepiece==0.2.1" "sacremoses==0.1.1" ;;
            cd_booklets)
              python -m pip install numpy "pypdfium2==5.15.2" ;;
            cd_films)
              python -m pip install numpy && sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            us_federal_forms|field_manual_figures)
              python -m pip install "pypdfium2==5.15.2" ;;
            seoul_sidewalks|urine_samples)
              python -m pip install "pillow-heif==1.1.1" ;;
            # PLP2019's drone photos and TyreNet's tyres come in RAR archives and AMLID's in a 7-Zip archive, which Python cannot open:
            # bsdtar (libarchive) does.
            plp_floating_targets|amlid_landmines|tyre_condition)
              sudo apt-get update && sudo apt-get install -y libarchive-tools ;;
          esac
      - name: Build the pack
        run: |
          key="${{ matrix.key }}"
          key="${key%+}"                 # "key+": a top-up pass of key
          key="${key%\?}"                # "key?": a needs-only run of key
