# Build the manual and instruction collections of the Digital Accessibility Toolkit (manuals/build_manuals.py) and
# publish them in the release "manuals", with manuals.json listing each collection's index file, size, SHA-256 and the
# estimated size of its manuals (the toolkit's Packages window reads it, category "Manual collections").
# Only facts, links, openly licensed instruction text and openly licensed thumbnails are published: never the
# manuals themselves (the toolkit fetches them from their official addresses for the owner's own use).
# Runs by hand (Actions > Build manual collections > Run workflow) or when manuals/request.txt changes on main (its
# text: the category keys, separated by commas, or all).
# Also every Wednesday at 09:53 UTC (stop it in manuals/schedule.txt): every collection is built again; one whose
# entries changed is published under a new name (manuals-<key>.<YYYY-MM-DD>.json.gz) and the older ones are kept
# and listed in manuals.json "versions".
name: Build manual collections

on:
  push:
    branches: ["main"]
    paths: ["manuals/request.txt"]
  schedule:
    - cron: "53 9 * * 3"
  workflow_dispatch:
    inputs:
      keys:
        description: "Category keys, separated by commas, or all"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: manual-collections
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - id: keys
        run: |
          keys='${{ inputs.keys }}'
          if [ -z "$keys" ]; then keys=$(grep -v '^#' manuals/request.txt | tr -d '[:space:]'); fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if grep -Eq '^\s*weekly\s*:\s*on' manuals/schedule.txt; then keys=all; else keys=none; fi
          fi
          python3 - "$keys" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          sys.path.insert(0, "manuals")
          import categories
          known = list(categories.CATEGORIES)
          words = [w for w in sys.argv[1].split(",") if w]
          keys = known if words in ([], ["all"]) else [w for w in words if w in known]
          print("keys=" + json.dumps(keys))
          PY

  build:
    needs: plan
    if: needs.plan.outputs.keys != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Few at a time: Open Food Facts allows 10 searches a minute from one address, and the categories share sites.
      max-parallel: 3
      matrix:
        key: ${{ fromJSON(needs.plan.outputs.keys) }}
    env:
      GH_TOKEN: ${{ github.token }}
      # The Picture Describers website's export key (a repository secret); without it that source is skipped.
      DESCRIBE_SITE_KEY: ${{ secrets.DESCRIBE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the builder needs
        run: |
          python -m pip install requests pillow
          case "${{ matrix.key }}" in
            # Back-of-pack photos that Open Food Facts has no OCR text for are read with tesseract.
            frozen_meals|product_directions)
              sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng ;;
          esac
      - name: Keep the answers between runs
        uses: actions/cache@v4
        with:
          path: build/manuals-cache
          key: manuals-cache-${{ matrix.key }}-${{ github.run_id }}
          restore-keys: manuals-cache-${{ matrix.key }}-
      - name: Build the collection
        run: |
          case "${{ matrix.key }}" in
            frozen_meals) limit=2400 ;;
            product_directions) limit=1200 ;;
            health_devices) limit=1500 ;;
            cars) limit=600 ;;
            # The big household collections: products from about 1990 to today.
            computers|tv_audio_video|older_electronics|lawn_garden|home_systems|home_appliances|small_kitchen) limit=4000 ;;
            # Collections built from many Internet Archive collections (each console, synthesizer maker, radio library).
            video_games|musical_instruments|ham_radio|vintage_computers|farm_equipment|home_medical) limit=4000 ;;
            # Every registered pesticide product of the US (about 19,000 active) and Canada (about 7,800 current).
            pesticide_labels) limit=30000 ;;
            *) limit=1500 ;;
          esac
          # Stop requesting after 290 minutes (listing stops at half of that), so the index is published in time.
          MANUALS_TIME_LIMIT_MINUTES=290 python manuals/build_manuals.py "${{ matrix.key }}" --out build/manuals \
            --cache build/manuals-cache --limit "$limit"
      - name: Upload it to the release
        run: |
          gh release view manuals > /dev/null 2>&1 || gh release create manuals \
            --title "Manual and instruction collections" \
            --notes "Indexes of product manuals (facts and official addresses only: the manuals belong to their makers and are not published here) and openly licensed plain-text instructions, for the Digital Accessibility Toolkit (manuals/build_manuals.py)."
          files=$(python -c "import json;print(' '.join(json.load(open('build/manuals/manifest-${{ matrix.key }}.json'))['files']))")
          for f in $files manifest-${{ matrix.key }}.json; do
            for attempt in 1 2 3 4; do
              gh release upload manuals "build/manuals/$f" --clobber && break
              sleep 30
            done
          done

  catalogue:
    needs: [plan, build]
    if: always() && needs.plan.outputs.keys != '[]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge the manifests into manuals.json (every version kept)
        run: |
          mkdir -p merged && cd merged
          gh release download manuals -p 'manifest-*.json' --clobber || true
          gh release download manuals -p 'manuals.json' -O previous.json --clobber || true
          cd ..
          python manuals/build_manuals.py --merge merged/manifest-*.json --existing merged/previous.json --out merged
          gh release upload manuals merged/manuals.json --clobber
      - name: Delete only index files no version lists and older than two days (same entries built again)
        run: |
          python - <<'PY'
          import datetime, json, subprocess
          cat = json.load(open("merged/manuals.json"))
          keep = {c["file"] for c in cat["collections"].values()}
          keep |= {v["file"] for c in cat["collections"].values() for v in c.get("versions", [])}
          old = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=2)).isoformat()
          out = subprocess.run(["gh", "release", "view", "manuals", "--json", "assets"], capture_output=True, text=True)
          for a in json.loads(out.stdout or '{"assets": []}')["assets"]:
              if a["name"].startswith("manuals-") and a["name"] not in keep and a.get("createdAt", "9") < old:
                  subprocess.run(["gh", "release", "delete-asset", "manuals", a["name"], "-y"])
          PY
