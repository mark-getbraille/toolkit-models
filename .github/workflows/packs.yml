# Build the training-data packs of the Picture Model Training Kit (packs/build_packs.py) and publish them in the
# release "training-data", with packs.json listing each pack's parts, size and SHA-256 (the kit reads it).
# Runs by hand (Actions > Build training packs > Run workflow) or when packs/request.txt changes on main (its text:
# the pack keys, separated by commas, or all).
name: Build training packs

on:
  push:
    branches: ["main"]
    paths: ["packs/request.txt"]
  workflow_dispatch:
    inputs:
      keys:
        description: "Pack keys, separated by commas, or all"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: training-packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - id: keys
        run: |
          keys='${{ inputs.keys }}'
          if [ -z "$keys" ]; then keys=$(grep -v '^#' packs/request.txt | tr -d '[:space:]'); fi
          python3 - "$keys" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          known = ["smithsonian", "coco_questions", "commons", "tepapa", "inaturalist", "nutrition5k", "fresh_rotten",
                   "banknotes", "cattle_health", "clothing", "japan_search", "ksamsok", "rijksmuseum", "stair_captions",
                   "coco_cn", "eggs", "beef", "taiwan_pills", "pharmassist", "mediseg", "open_images_food",
                   "grocery_store", "fish_eyes", "commons_food", "open_images_objects", "orbit", "core50",
                   "lila_camera_traps", "gbif_species", "commons_breeds",
                   "textocr", "coco_text", "cord", "doclaynet", "plotqa", "loc_letters", "ptl_crossings",
                   "uroac_crossings", "open_images_street", "walkway_dhaka", "outdoor_navigation", "seoul_sidewalks",
                   "dollar_street", "geode", "art_nudes", "anatomy",
                   "skin_lesion_photos", "isic_skin", "gi_endoscopy", "chest_xray", "case_report_figures", "vet_case_figures", "cdc_medical", "childhood_illness", "medical_collections", "birth_and_feeding",
                   "oi_expressions", "commons_expressions", "bice_gestures", "vqa_expressions",
                   "xm3600", "europeana_fi", "europeana_cs",
                   "europeana_hu", "europeana_el", "europeana_no", "europeana_pl", "bd_taka", "medpack_id", "fashionpedia",
                   "loc_highsmith", "loc_fsa", "loc_world", "npgallery", "earth_observatory", "eso", "usgs", "commons_valued",
                   "open_images_disability", "commons_disability", "tapad_tactile_paving",
                   "loc_civil_war", "loc_war_disaster", "nara_war", "ushmm", "commons_war", "commons_disasters",
                   "commons_safety", "nara", "nypl", "getty_museum", "digital_commonwealth", "smk", "anefo",
                   "kremlin", "awm",
                   "commons_military", "commons_airplanes", "commons_uniformed", "loc_service",
                   "nara_military", "army_mil", "nasm_aircraft", "nmah_service",
                   "scatspotter", "inat_droppings", "open_images_bodily", "commons_bodily",
                   "case_report_bodily", "urine_samples",
                   "open_images_culture", "wikidata_sports", "wikidata_instruments", "met_instruments",
                   "wikidata_worship", "commons_religious_life", "wikidata_landmarks",
                   "wikidata_architecture", "gldv2_landmarks", "wikidata_vehicle_models",
                   "commons_vehicle_kinds", "wikidata_toys_games", "playing_cards", "chess_pieces",
                   "chess_positions", "chess_drawings", "drawn_cards", "deepscores_sheet_music",
                   "agml_plant_health", "agml_weeds", "agml_harvest", "gwhd_wheat", "poultry_droppings",
                   "inat_crops", "trashnet", "taco_litter", "ccsn_clouds", "weather_images", "eurosat",
                   "commons_land_industry", "loc_haer", "plitter_street", "plp_floating_targets", "usda_ars",
                   "clock_times", "seven_segment", "open_images_home", "commons_pests", "commons_appliances",
                   "commons_connectors", "laundry_symbols", "commons_tools", "commons_personal",
                   "commons_hairstyles", "commons_kitchen",
                   "commons_events", "loc_events", "nara_events", "europeana_events", "safety_signs",
                   "commons_safety_photos", "safety_training", "dfire_cameras"]
          words = [w for w in sys.argv[1].split(",") if w]
          keys = known if words in ([], ["all"]) else [w for w in words if w in known]
          print("keys=" + json.dumps(keys))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        key: ${{ fromJSON(needs.plan.outputs.keys) }}
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      # Europeana's free API key (a repository secret); without it the builders use the public demonstration key.
      EUROPEANA_KEY: ${{ secrets.EUROPEANA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the builder needs
        run: |
          python -m pip install requests pillow pyarrow "huggingface_hub>=0.34"
          # The packs in other languages are also translated into English (OPUS-MT, on the processor).
          case "${{ matrix.key }}" in
            ksamsok|rijksmuseum|coco_cn|europeana_fi|europeana_cs|europeana_hu|europeana_el|europeana_no|europeana_pl|smk|anefo)
              python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
              python -m pip install "transformers==4.57.6" "sentencepiece==0.2.1" "sacremoses==0.1.1" ;;
            seoul_sidewalks|urine_samples)
              python -m pip install "pillow-heif==1.1.1" ;;
            # PLP2019's drone photos come in a RAR archive, which Python cannot open: bsdtar (libarchive) does.
            plp_floating_targets)
              sudo apt-get update && sudo apt-get install -y libarchive-tools ;;
          esac
      - name: Build the pack
        run: |
          case "${{ matrix.key }}" in
            smithsonian) limit=6000 ;;
            coco_questions) limit=8000 ;;
            commons) limit=5000 ;;
            tepapa) limit=3000 ;;
            inaturalist) limit=12000 ;;
            nutrition5k) limit=3500 ;;
            fresh_rotten) limit=3200 ;;
            banknotes) limit=3000 ;;
            cattle_health) limit=1700 ;;
            clothing) limit=5000 ;;
            japan_search) limit=3000 ;;
            ksamsok) limit=5000 ;;
            rijksmuseum) limit=6000 ;;
            stair_captions) limit=20000 ;;
            coco_cn) limit=4000 ;;
            eggs) limit=6000 ;;
            beef) limit=60 ;;
            taiwan_pills) limit=2000 ;;
            pharmassist) limit=2050 ;;
            mediseg) limit=6000 ;;
            open_images_food) limit=10000 ;;
            grocery_store) limit=5421 ;;
            fish_eyes) limit=4390 ;;
            commons_food) limit=1500 ;;
            open_images_objects) limit=12000 ;;
            orbit) limit=7000 ;;
            core50) limit=4000 ;;
            lila_camera_traps) limit=8000 ;;
            gbif_species) limit=6000 ;;
            commons_breeds) limit=3000 ;;
            textocr) limit=8000 ;;
            coco_text) limit=1200 ;;
            cord) limit=1000 ;;
