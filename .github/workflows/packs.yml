# Build the training-data packs of the Picture Model Training Kit (packs/build_packs.py) and publish them in the
# release "training-data", with packs.json listing each pack's parts, size and SHA-256 (the kit reads it).
# Runs by hand (Actions > Build training packs > Run workflow) or when packs/request.txt changes on main (its text:
# the pack keys, separated by commas, or all).
# A key written with a plus ("loc_fsa+") asks for a top-up pass: the published pack is kept and only new pictures are
# added to it, up to its limit (build_packs.py --top-up). If the pass fails or finds nothing new, the published pack
# stays as it is. A top-up pack's files are named <key>.pass<N>.zip; the last job removes a pack's old files once
# packs.json names the new ones.
# Pictures that pass every rule but were dropped only because their description is missing or poor are set aside
# (build_packs.py needs_description) and published in a SEPARATE release, "needs-description", as
# needs-<key>.v<N>.zip with needs-manifest.json (the release "training-data" is not touched by this). A key written
# with a question mark ("loc_fsa?") asks for a "needs only" run: the pack's listing is read again and only its
# set-aside pictures are collected and published; the pack itself is not built, changed or republished.
name: Build training packs

on:
  push:
    branches: ["main"]
    paths: ["packs/request.txt"]
  workflow_dispatch:
    inputs:
      keys:
        description: "Pack keys, separated by commas, or all (loc_fsa+ adds to the published pack; loc_fsa? collects only the pictures that need a description)"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: training-packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - id: keys
        run: |
          keys='${{ inputs.keys }}'
          if [ -z "$keys" ]; then keys=$(grep -v '^#' packs/request.txt | tr -d '[:space:]'); fi
