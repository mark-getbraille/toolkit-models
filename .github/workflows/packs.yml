            kremlin) limit=3000 ;;
            awm) limit=3000 ;;
            commons_military) limit=4000 ;;
            commons_airplanes) limit=2500 ;;
            commons_uniformed) limit=4000 ;;
            loc_service) limit=4000 ;;
