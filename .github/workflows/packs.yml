            isic_skin) limit=12000 ;;
            gi_endoscopy) limit=8000 ;;
            chest_xray) limit=8000 ;;
            case_report_figures) limit=10000 ;;
            vet_case_figures) limit=3000 ;;
            cdc_medical) limit=600 ;;
            childhood_illness) limit=300 ;;
            medical_collections) limit=300 ;;
            birth_and_feeding) limit=1500 ;;
            oi_expressions) limit=12000 ;;
            commons_expressions) limit=1500 ;;
            bice_gestures) limit=1430 ;;
            vqa_expressions) limit=1200 ;;
            xm3600) limit=3600 ;;
            europeana_fi) limit=6000 ;;
            europeana_cs) limit=4000 ;;
            europeana_hu) limit=4000 ;;
            europeana_el) limit=4000 ;;
            europeana_no) limit=6000 ;;
            europeana_pl) limit=1500 ;;
            bd_taka) limit=547 ;;
            medpack_id) limit=1444 ;;
            fashionpedia) limit=5000 ;;
            loc_highsmith) limit=6000 ;;
