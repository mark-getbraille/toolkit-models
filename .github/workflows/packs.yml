          words = [w for w in sys.argv[1].split(",") if w]
          # "key+" is a top-up pass of key and "key?" a needs-only run (kept with the mark, which the build job reads);
          # "all?" asks for a needs-only run of every pack.
          if words in (["all?"],):
              keys = [k + "?" for k in known]
          else:
              keys = known if words in ([], ["all"]) else [w for w in words if w.rstrip("+?") in known]
          print("keys=" + json.dumps(keys))
          # The two lanes (build_packs.pack_lanes): the packs that read Wikimedia Commons, and the rest. build_packs is
          # imported with its printing sent to the log, so nothing but these lines reaches GITHUB_OUTPUT.
          import contextlib
          sys.path.insert(0, "packs")
          with contextlib.redirect_stdout(sys.stderr):
              from build_packs import pack_lanes
          commons, other = pack_lanes(keys)
          print("commons=" + json.dumps(commons))
          print("other=" + json.dumps(other))
          PY

  # The builds run in two lanes at the same time (the build job itself is in pack-build.yml): the packs that read
  # Wikimedia Commons (build_packs.COMMONS_KEYS) two at a time, because Commons refused requests (429) for hours when
  # many read it together, and every other pack eight at a time. A lane with no keys is skipped.
  build:
    needs: plan
    if: needs.plan.outputs.other != '[]'
    uses: ./.github/workflows/pack-build.yml
    with:
      keys: ${{ needs.plan.outputs.other }}
      parallel: 8
    secrets: inherit

  build-commons:
    needs: plan
    if: needs.plan.outputs.commons != '[]'
    uses: ./.github/workflows/pack-build.yml
    with:
      keys: ${{ needs.plan.outputs.commons }}
      parallel: 2
    secrets: inherit

  manifest:
    needs: [build, build-commons]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Merge the packs' manifests into packs.json
        run: |
          mkdir -p merged && cd merged
          gh release download training-data -p 'manifest-*.json' --clobber || true
          python3 - <<'PY'
          import glob, json
          packs = {}
          for path in sorted(glob.glob("manifest-*.json")):
              data = json.load(open(path))
              packs[data["key"]] = data
          json.dump(packs, open("packs.json", "w"), indent=1)
          print(json.dumps(packs, indent=1))
          PY
          gh release upload training-data packs.json --clobber
      - name: Remove pack files that packs.json no longer names
        run: |
          # After a top-up pass (files <key>.pass<N>.zip...) or a rebuild that came out in fewer parts, the pack's
          # earlier files are left in the release. Only files named like a listed pack's own files ("<key>.zip",
          # "<key>.zip.001", "<key>.pass2.zip.001") that packs.json does not name are removed.
          cd merged
          gh release view training-data --json assets -q '.assets[].name' > assets.txt
          python3 - > stale.txt <<'PY'
          import json, re
          packs = json.load(open("packs.json"))
          named = {f for p in packs.values() for f in p.get("files", [])}
          for asset in open("assets.txt").read().split():
              m = re.match(r"^(.+?)(\.pass\d+)?\.zip(\.\d{3})?$", asset)
              if m and m.group(1) in packs and asset not in named:
                  print(asset)
          PY
          for f in $(cat stale.txt); do
            echo "Removing $f (an earlier file of its pack)"
            gh release delete-asset training-data "$f" --yes || true
          done

  needs-manifest:
    needs: [build, build-commons]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # This job has no checkout, so gh must be told the repository (without it every gh command failed and the
      # combined needs-manifest.json was never written).
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge the needs zips' manifests into needs-manifest.json
        run: |
          gh release view needs-description > /dev/null 2>&1 || { echo "No needs-description release yet."; exit 0; }
          mkdir -p merged && cd merged
          gh release download needs-description -p 'needs-manifest-*.json' --clobber || true
          python3 - <<'PY'
          import glob, json
          needs = {}
          for path in sorted(glob.glob("needs-manifest-*.json")):
              data = json.load(open(path))
              needs[data["key"]] = data
          json.dump(needs, open("needs-manifest.next.json", "w"), indent=1)
          print(json.dumps(needs, indent=1))
          PY
          # Replace needs-manifest.json without a moment when a reader finds none: the new copy is uploaded as
          # needs-manifest.next.json first (readers fall back to it), the old one is removed and the new one renamed.
          repo="${{ github.repository }}"
          gh release upload needs-description needs-manifest.next.json --clobber
          assets="repos/$repo/releases/tags/needs-description"
          old=$(gh api "$assets" --jq '.assets[] | select(.name=="needs-manifest.json") | .id')
          if [ -n "$old" ]; then gh api -X DELETE "repos/$repo/releases/assets/$old"; fi
          new=$(gh api "$assets" --jq '.assets[] | select(.name=="needs-manifest.next.json") | .id')
          gh api -X PATCH "repos/$repo/releases/assets/$new" -f name=needs-manifest.json > /dev/null
      - name: Remove needs zips that needs-manifest.json no longer names
        run: |
          gh release view needs-description > /dev/null 2>&1 || exit 0
          cd merged
          gh release view needs-description --json assets -q '.assets[].name' > assets.txt
          python3 - > stale.txt <<'PY'
          import json, re
          needs = json.load(open("needs-manifest.next.json"))
          for asset in open("assets.txt").read().split():
              m = re.match(r"^needs-(.+)\.v\d+\.zip$", asset)
              if m and m.group(1) in needs and asset != needs[m.group(1)]["file"]:
                  print(asset)
          PY
          for f in $(cat stale.txt); do
            echo "Removing $f (an earlier version of its needs zip)"
            gh release delete-asset needs-description "$f" --yes || true
          done
