            eso) limit=1200 ;;
            usgs) limit=4000 ;;
            commons_valued) limit=2500 ;;
            open_images_disability) limit=219 ;;
            commons_disability) limit=1500 ;;
            tapad_tactile_paving) limit=2811 ;;
            loc_civil_war) limit=3000 ;;
            loc_war_disaster) limit=3000 ;;
            nara_war) limit=1500 ;;
            ushmm) limit=2500 ;;
            commons_war) limit=2500 ;;
